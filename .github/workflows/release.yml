name: era-uma-release

on:
  push:
    tags:
      - "v*"

jobs:
  build-on-windows:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Make game main directory
        run: |
          mkdir ./erauma${{ github.ref_name }}
          cp -r ./ere ./erauma{{ github.ref_name }}
          cp -r ./csv ./erauma{{ github.ref_name }}
      - name: Zip game main
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: '7z'
          filename: 'era-uma-preview-${{ github.ref_name }}.7z'
          directory: ./erauma{{ github.ref_name }}
          custom: -pera
      - name: Make game res directory
        run: |
          mv ./erauma${{ github.ref_name }} ./unused
          mkdir ./erauma${{ github.ref_name }}
          cp -r ./res ./erauma{{ github.ref_name }}
      - name: Zip game
        uses: thedoctor0/zip-release@0.7.5
        with:
          type: '7z'
          filename: 'era-uma-preview-res-${{ github.ref_name }}.7z'
          directory: ./erauma{{ github.ref_name }}
          custom: -pera
      - name: Check files
        run: ls ./
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: EraUma ${{ github.ref_name }}
          body: built by Github Actions
          draft: false
          prerelease: false
          files: './engine/dist_electron/era-uma-preview-${{ github.ref_name }}.7z'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: EraUma ${{ github.ref_name }}
          body: built by Github Actions
          draft: false
          prerelease: false
          files: './engine/dist_electron/era-uma-preview-res-${{ github.ref_name }}.7z'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
