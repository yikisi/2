workflow:
  rules:
    - if: $CI_COMMIT_TAG

variables:
  GAME_ALL_DIR: 'erauma-with-engine-${CI_COMMIT_TAG}'
  GAME_ALL_ZIP: 'erauma-with-engine-${CI_COMMIT_TAG}-win-x64.7z'
  GAME_ZIP_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/erauma/${CI_COMMIT_TAG}/erauma-with-engine-${CI_COMMIT_TAG}-win-x64.7z'
  GAME_DIR: 'erauma-${CI_COMMIT_TAG}'
  GAME_ZIP: 'erauma-${CI_COMMIT_TAG}.7z'
  GAME_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/erauma/${CI_COMMIT_TAG}/erauma-${CI_COMMIT_TAG}.7z'
  BASE_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/base/${CI_COMMIT_TAG}/base.zip'
  GAME_BUNDLE_DIR: 'erauma-android-${CI_COMMIT_TAG}'
  GAME_BUNDLE_ZIP: 'erauma-android-${CI_COMMIT_TAG}.zip'
  GAME_BUNDLE_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/bundle/${CI_COMMIT_TAG}/erauma-android-${CI_COMMIT_TAG}.zip'
  CALL_SIGN: 'agito'
  RES_VERSION: '20250816'

build:
  stage: build
  tags:
    - shell
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
  script:
    - npm install
    - node ci/build.js

android:
  stage: build
  tags:
    - shell
  script:
    - npm install
    - node ci/android.js

pages:
  stage: deploy
  tags:
    - shell
  script:
    - node ci/pages.js
  artifacts:
    paths:
      - public

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:v0.23.0
  needs:
    - job: build
  tags:
    - docker
  script:
    - sed -i '1,4d' ./RELEASE.md
    - echo "Releasing..."
  release:
    name: 'EraUma v$CI_COMMIT_TAG ($CALL_SIGN)'
    description: './RELEASE.md'
    tag_name: $CI_COMMIT_TAG
    ref: '$CI_COMMIT_SHA'
    assets:
      links:
        - name: '[Win10绿色版] $GAME_ALL_ZIP (解压密码：era)'
          url: 'https://umaera.gitgud.site/erauma/index.html'
          link_type: package
        - name: '[PC游戏包] $GAME_ZIP (解压密码：era)'
          url: '${GAME_URL}'
          link_type: package
        - name: '[安卓游戏包] $GAME_BUNDLE_ZIP (解压密码：era)'
          url: '${GAME_BUNDLE_URL}'
          link_type: package
        - name: '[通用资源包] erauma-master-res.zip (版本号 $RES_VERSION，解压后将 res 文件夹放到游戏文件夹下，在游戏设置中启用资源)'
          url: 'https://gitgud.io/umaera/erauma/-/archive/master/erauma-master.zip?path=res'
