workflow:
  rules:
    - if: $CI_COMMIT_TAG

variables:
  GAME_ALL_DIR: 'erauma-with-engine-${CI_COMMIT_TAG}'
  GAME_ALL_ZIP: 'era-uma-preview-with-engine-${CI_COMMIT_TAG}-win-x64.7z'
  GAME_ZIP_URL: '${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/erauma/${CI_COMMIT_TAG}/era-uma-preview-with-engine-${CI_COMMIT_TAG}-win-x64.7z'

build:
  stage: build
  tags:
    - shell
  variables:
    NODE_OPTIONS: "--openssl-legacy-provider"
  script:
    - git submodule update --init
    - cd engine
    - git lfs pull
    - npm install
    - npm run win:pack
    - '[ -d $GAME_ALL_DIR ] && rm -rf ./$GAME_ALL_DIR'
    - mkdir ./$GAME_ALL_DIR
    - mv dist_electron/win-unpacked/* $GAME_ALL_DIR/
    - mkdir $GAME_ALL_DIR/game
    - cp ../CHANGELOG.md ./$GAME_ALL_DIR/game/
    - cp ../RELEASE.md ./$GAME_ALL_DIR/game/
    - cp -r ../ere ./$GAME_ALL_DIR/game/
    - cp -r ../csv ./$GAME_ALL_DIR/game/
    - cp -r ../res ./$GAME_ALL_DIR/game/
    - 7zz a -pera $GAME_ALL_ZIP ./$GAME_ALL_DIR
    - 'curl --fail-with-body --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file ${GAME_ALL_ZIP} "${GAME_ZIP_URL}"'

pages:
  stage: deploy
  tags:
    - shell
  script:
    - rm -rf public
    - mkdir public
    - 7zz a base.7z ./ere ./csv RELEASE.md CHANGELOG.md
    - mv *.7z public/
    - VERSION=`cat csv/GameBase.csv | grep 'バージョン,'`
    - echo ${VERSION#*,} > public/RELEASE
  artifacts:
    paths:
      - public

release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
  tags:
    - docker
  script:
    - echo "Releasing..."
  release:
    tag_name: $CI_COMMIT_TAG
    name: 'EraUma $CI_COMMIT_TAG'
    description: './RELEASE.md'
    assets:
      links:
        - name: '[解压即玩包] $GAME_ALL_ZIP'
          url: '${GAME_ZIP_URL}'
          link_type: package