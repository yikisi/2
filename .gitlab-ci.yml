release:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/release-cli:v0.24.0
  needs:
    - job: build
  tags:
    - docker
  script:
    - sed -i '1,4d' ./RELEASE.md
    - npm install
    - node ci/release.js
    - cat release.yml
    - release-cli create --config release.yml